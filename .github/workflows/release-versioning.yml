name: Release Version Bump

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: versioning-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.GH_PAT }}

      - name: Determine release bump type
        id: bump-type
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          BUMP="minor"
          if grep -q '"release:hotfix"' <<< "$LABELS"; then
            echo "release:hotfix is only valid for a hotfix PR targeting prod" >&2
            exit 1
          elif grep -q '"release:major"' <<< "$LABELS"; then
            BUMP="major"
          elif grep -q '"release:minor"' <<< "$LABELS"; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump release version
        env:
          BUMP_TYPE: ${{ steps.bump-type.outputs.bump }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag -l --sort=-v:refname | head -n 1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"

          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest tag is not a semantic version: $LATEST_TAG" >&2
            exit 1
          fi

          CLEAN_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported bump type: $BUMP_TYPE" >&2
              exit 1
              ;;
          esac

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" "$MERGE_SHA"
          git push origin "$NEW_TAG"

      - name: Merge release back into dev
        run: |
          set -euo pipefail

          git fetch origin dev release
          git checkout -B dev origin/dev
          git merge origin/release -m "chore: mergeback release to dev [skip ci]"
          git push origin dev
